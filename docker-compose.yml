# Manhour system  ->  http://localhost:3002
name: manhour

services:
  app:
    build: .
    image: manhour:latest
    container_name: manhour
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env.docker
    environment:
      UPLOAD_DIR: /app/uploads
      TESSDATA_DIR: /app/tessdata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Scanned sheet photos stay in the project's uploads folder on Windows
      - type: bind
        source: "C:/Users/Dell/Repo/manhour-sys/manhour-system/manhour/uploads"
        target: /app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional HTTPS front (live QR camera on phones). Off unless started with:
  #   docker compose --profile https up -d
  # Set HTTPS_HOST in .env.https (see .env.https.example), then open https://<HTTPS_HOST>:3443
  https:
    image: caddy:2.8.4-alpine
    container_name: manhour-https
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3443:3443"
    env_file:
      - path: .env.https
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Caddy's certificate authority and certificates: keep them, or phones must trust a new root certificate
  caddy_data:
  caddy_config:
